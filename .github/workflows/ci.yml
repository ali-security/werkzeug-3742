name: CI

on: push

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: 'Python 3.8 Linux',   os: ubuntu-22.04,   python-version: '3.8',  toxenv: py}
          - {name: 'Python 3.8 Windows', os: windows-2022,   python-version: '3.8',  toxenv: py}
          - {name: 'Python 3.8 Mac',     os: macos-15-intel, python-version: '3.8',  toxenv: py}
          - {name: 'PyPy 3 Linux',       os: ubuntu-22.04,   python-version: pypy3,  toxenv: py}
          - {name: 'Python 3.7 Linux',   os: ubuntu-22.04,   python-version: '3.7',  toxenv: py}
          - {name: 'Python 3.6 Linux',   os: ubuntu-22.04,   python-version: '3.6',  toxenv: py}
          - {name: 'Python 3.5 Linux',   os: ubuntu-22.04,   python-version: '3.5',  toxenv: py}
          - {name: 'Python 2.7 Linux',   os: ubuntu-22.04,   python-version: '2.7',  toxenv: py}
          - {name: 'Python 2.7 Windows', os: windows-2022,   python-version: '2.7',  toxenv: py}
    env:
      TOXENV: ${{ matrix.toxenv }}
    steps:
      - uses: actions/checkout@v3

      - name: Install OS build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libffi-dev pkg-config

      - name: Install OpenSSL 1.1 (PyPy cryptography build)
        if: matrix.python-version == 'pypy3'
        run: |
          mkdir -p /tmp/ssl11debs
          cd /tmp/ssl11debs
          wget -q http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          wget -q http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl-dev_1.1.1f-1ubuntu2_amd64.deb
          sudo dpkg-deb -x libssl1.1_1.1.1f-1ubuntu2_amd64.deb /opt/ssl11
          sudo dpkg-deb -x libssl-dev_1.1.1f-1ubuntu2_amd64.deb /opt/ssl11
          echo "CFLAGS=-I/opt/ssl11/usr/include/x86_64-linux-gnu -I/opt/ssl11/usr/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L/opt/ssl11/usr/lib/x86_64-linux-gnu -Wl,-rpath,/opt/ssl11/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      - name: Build OpenSSL 1.1 (macOS cryptography build)
        if: runner.os == 'macOS'
        run: |
          cd /tmp
          curl -sL https://www.openssl.org/source/openssl-1.1.1w.tar.gz -o openssl.tgz
          tar -xzf openssl.tgz
          cd openssl-1.1.1w
          ./Configure darwin64-x86_64-cc --prefix=/opt/ssl11 no-shared
          make -j"$(sysctl -n hw.ncpu)"
          sudo make install_sw
          echo "CFLAGS=-I/opt/ssl11/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L/opt/ssl11/lib" >> "$GITHUB_ENV"

      - name: Use Python ${{ matrix.python-version }}
        uses: MatteoH2O1999/setup-python@v1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure pip index URL
        run: pip config set global.index-url "https://eyJjb2RlY292IjogIjIuMS4xMyIsICJhdG9taWN3cml0ZXMiOiAiMS4wLjAifQ==:2020-03-31T21:00:00.000Z@time-machines-pypi.sealsecurity.io/"

      - name: Downgrade pip and setuptools
        run: python -m pip install --upgrade --force-reinstall "pip<21" "setuptools<45"

      - name: Install tox
        run: pip --disable-pip-version-check install -U tox

      - name: Run tox
        run: tox -s false -- --junit-xml=test-results.xml

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Use Python 3.8
        uses: MatteoH2O1999/setup-python@v1
        with:
          python-version: '3.8'

      - name: Configure pip index URL
        run: pip config set global.index-url "https://:2020-03-31T21:00:00.000Z@time-machines-pypi.sealsecurity.io/"

      - name: Downgrade pip and setuptools
        run: python -m pip install --upgrade --force-reinstall "pip<21" "setuptools<45"

      - name: Install wheel
        run: pip --disable-pip-version-check install -U wheel==0.34.2

      - name: Build sdist and wheel
        run: python setup.py sdist bdist_wheel

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
